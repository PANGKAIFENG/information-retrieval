name: Daily Horizon Summary

on:
  schedule:
    - cron: '0 1 * * *'  # Runs daily at 09:00 Beijing time (UTC 01:00)
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
        run: uv run horizon --hours 48

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      - name: Push to Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          FEISHU_RECEIVE_ID_TYPE: ${{ secrets.FEISHU_RECEIVE_ID_TYPE }}
        run: |
          if [ -z "${FEISHU_APP_ID}" ] || [ -z "${FEISHU_APP_SECRET}" ]; then
            echo "⚠️ FEISHU_APP_ID or FEISHU_APP_SECRET not set, skipping Feishu push."
            exit 0
          fi
          if [ -z "${FEISHU_RECEIVE_ID}" ]; then
            echo "⚠️ FEISHU_RECEIVE_ID not set, skipping Feishu push."
            echo "  You need to set FEISHU_RECEIVE_ID (your open_id/user_id/email/chat_id)"
            echo "  and FEISHU_RECEIVE_ID_TYPE (open_id/user_id/email/chat_id) in GitHub Secrets."
            exit 0
          fi
          # Find the latest summary file
          SUMMARY_FILE="docs/_posts/${DATE}-summary-zh.md"
          if [ ! -f "$SUMMARY_FILE" ]; then
            SUMMARY_FILE="docs/_posts/${DATE}-summary-en.md"
          fi
          if [ ! -f "$SUMMARY_FILE" ]; then
            echo "⚠️ No summary file found for ${DATE}, looking for latest..."
            SUMMARY_FILE=$(ls -t docs/_posts/*-summary-*.md 2>/dev/null | head -1)
          fi
          if [ -z "$SUMMARY_FILE" ] || [ ! -f "$SUMMARY_FILE" ]; then
            echo "✗ No summary file found at all. Horizon may have failed."
            exit 1
          fi
          echo "📄 Pushing $SUMMARY_FILE to Feishu..."
          # Strip Jekyll front matter (between --- markers)
          python3 scripts/feishu_push.py --file "$SUMMARY_FILE" --date "${DATE}"
